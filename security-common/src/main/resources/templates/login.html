<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in</title><link rel="stylesheet" th:href="@{/assets/app.css}"></head>
<body><main>
    <p class="eyebrow">Account access</p><h1>Sign in</h1>
    <p th:if="${param.error}" role="alert">Email or password is incorrect, or sign-in is temporarily blocked.</p>
    <p th:if="${param.logout}" role="status">You have signed out.</p>
    <form th:action="@{/login}" method="post">
        <label for="email">Email</label><input id="email" name="email" type="email" autocomplete="username" maxlength="254" required>
        <label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required>
        <button type="submit">Sign in</button>
    </form>
</main></body></html>
