spring:
  application:
    name: security-app
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/security}
    username: ${DB_USERNAME:security}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
server:
  port: ${PORT:8080}
  servlet:
    session:
      cookie:
        name: SECURITY_SESSION
        http-only: true
        same-site: lax
        secure: ${COOKIE_SECURE:false}
      timeout: 20m
