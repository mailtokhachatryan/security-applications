spring:
  application:
    name: secret-providers
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/secrets}
    username: ${DB_USERNAME:security}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
server:
  port: ${PORT:8081}
  tomcat:
    max-http-form-post-size: 64KB
  servlet:
    session:
      cookie:
        name: SECRETS_SESSION
        http-only: true
        same-site: lax
        secure: ${COOKIE_SECURE:false}
      timeout: 20m
secrets:
  public-base-url: ${SECRET_PUBLIC_BASE_URL:http://localhost:8081}
  encryption-key: ${SECRET_ENCRYPTION_KEY}
