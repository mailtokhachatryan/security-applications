<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Secret Providers</title><link rel="stylesheet" th:href="@{/assets/app.css}"></head>
<body><main><p class="eyebrow">Secret Providers</p><h1>Share a secret once</h1>
<p>Create a link for someone with a STANDARD account. Revealing the secret deletes the stored copy.</p>
<form th:action="@{/secrets}" method="post"><label for="content">Your secret</label>
<textarea id="content" name="content" maxlength="8192" autocomplete="off" required></textarea><button type="submit">Create one-time link</button></form>
<a th:href="@{/sign-out}">Sign out</a></main></body></html>
